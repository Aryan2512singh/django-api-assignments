{% extends "base.html" %}

{% block title %}
My Profile - ShopZone
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-card profile-card">

            <h1>My Profile</h1>

            <p class="auth-subtitle">
                Your ShopZone account details
            </p>

            <div id="message" class="auth-message"></div>

            <div id="profileData">

                <p>
                    Loading profile...
                </p>

            </div>

            <button
                type="button"
                class="btn logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>

</section>


<script>

async function loadProfile() {

    const accessToken =
        localStorage.getItem("access");


    if (!accessToken) {

        window.location.href =
            "/login/";

        return;
    }


    try {

        const response = await fetch(
            "/api/auth/profile/",
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${accessToken}`
                }
            }
        );


        const data =
            await response.json();


        if (response.status === 401) {

            localStorage.removeItem("access");
            localStorage.removeItem("refresh");

            window.location.href =
                "/login/";

            return;
        }


        if (!response.ok) {

            document.getElementById(
                "message"
            ).textContent =
                data.error ||
                data.detail ||
                "Unable to load profile.";

            return;
        }


        document.getElementById(
            "profileData"
        ).innerHTML = `

            <div class="profile-info">

                <div class="profile-row">

                    <span>
                        User ID
                    </span>

                    <strong>
                        ${data.id}
                    </strong>

                </div>

                <div class="profile-row">

                    <span>
                        Username
                    </span>

                    <strong>
                        ${data.username}
                    </strong>

                </div>

                <div class="profile-row">

                    <span>
                        Email
                    </span>

                    <strong>
                        ${data.email}
                    </strong>

                </div>

                <div class="profile-row">

                    <span>
                        Account Status
                    </span>

                    <strong>
                        ${
                            data.is_verified
                            ? "Verified ✓"
                            : "Not Verified"
                        }
                    </strong>

                </div>

            </div>

        `;


    } catch (error) {

        console.error(error);

        document.getElementById(
            "message"
        ).textContent =
            "Something went wrong.";

    }

}


async function logout() {

    const accessToken =
        localStorage.getItem("access");

    const refreshToken =
        localStorage.getItem("refresh");


    try {

        if (accessToken && refreshToken) {

            await fetch(
                "/api/auth/logout/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${accessToken}`
                    },

                    body: JSON.stringify({
                        refresh: refreshToken
                    })
                }
            );

        }

    } catch (error) {

        console.error(error);

    } finally {

        localStorage.removeItem("access");

        localStorage.removeItem("refresh");

        window.location.href =
            "/";

    }

}


loadProfile();

</script>

{% endblock %}
